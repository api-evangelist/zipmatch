name: ZipMatch
description: >-
  ZipMatch was an online real estate marketplace and property portal based in
  the Philippines, backed by 500 Startups (500 Global) among other investors,
  that helped buyers and renters discover homes, condominiums, and other
  property listings across Metro Manila and the wider Philippine market. It was
  surfaced as a 500 Global portfolio company and added to the API Evangelist
  network as a stub lead for enrichment. As of this enrichment pass the company
  appears to be defunct: the zipmatch.com domain is still registered (GoDaddy,
  registry expiry 2029) but has no DNS delegation — no NS, A, MX, or TXT records
  resolve — so there is no live website, developer portal, documentation, or API
  surface to harvest. This profile is retained as a historical portfolio-lead
  record; no API artifacts exist to enrich.
